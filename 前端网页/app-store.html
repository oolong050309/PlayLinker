<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Details | GameVerse Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { background: '#09090b', surface: '#18181b', primary: '#6366f1', secondary: '#a1a1aa' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #09090b; color: #ffffff; }
    .glass-panel { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .hero-gradient { background: linear-gradient(to bottom, transparent 0%, rgba(9, 9, 11, 0.8) 60%, #09090b 100%); }
  </style>
</head>
<body class="flex h-screen overflow-hidden">
  
  <!-- Sidebar (Condensed) -->
  <aside class="w-16 md:w-64 border-r border-white/10 bg-surface flex flex-col">
    <div class="p-4 md:p-6 flex items-center justify-center md:justify-start gap-2 border-b border-white/5">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center">
        <i data-lucide="gamepad-2" class="w-5 h-5 text-white"></i>
      </div>
      <span class="font-bold text-lg hidden md:block">GameVerse</span>
    </div>
    <nav class="flex-1 p-2 md:p-4 space-y-1">
      <a href="app-discover.html" class="flex items-center justify-center md:justify-start gap-3 px-2 md:px-4 py-3 text-zinc-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" title="Discover">
        <i data-lucide="compass" class="w-5 h-5"></i> <span class="hidden md:inline">Discover</span>
      </a>
      <a href="app-library.html" class="flex items-center justify-center md:justify-start gap-3 px-2 md:px-4 py-3 bg-indigo-600/10 text-indigo-400 rounded-xl font-medium" title="Library">
        <i data-lucide="library" class="w-5 h-5"></i> <span class="hidden md:inline">My Library</span>
      </a>
      <a href="app-analytics.html" class="flex items-center justify-center md:justify-start gap-3 px-2 md:px-4 py-3 text-zinc-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" title="Analytics">
        <i data-lucide="bar-chart-2" class="w-5 h-5"></i> <span class="hidden md:inline">Analytics</span>
      </a>
      <a href="app-price-monitor.html" class="flex items-center justify-center md:justify-start gap-3 px-2 md:px-4 py-3 text-zinc-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" title="Price Monitor">
        <i data-lucide="tag" class="w-5 h-5"></i> <span class="hidden md:inline">Price Monitor</span>
      </a>
      <a href="app-parental.html" class="flex items-center justify-center md:justify-start gap-3 px-2 md:px-4 py-3 text-zinc-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" title="Parental Controls">
        <i data-lucide="shield" class="w-5 h-5"></i> <span class="hidden md:inline">Parental</span>
      </a>
      <a href="app-binding.html" class="flex items-center justify-center md:justify-start gap-3 px-2 md:px-4 py-3 text-zinc-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" title="Binding">
        <i data-lucide="link" class="w-5 h-5"></i> <span class="hidden md:inline">Binding</span>
      </a>
      <a href="app-mods.html" class="flex items-center justify-center md:justify-start gap-3 px-2 md:px-4 py-3 text-zinc-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" title="Mods & Saves">
        <i data-lucide="package" class="w-5 h-5"></i> <span class="hidden md:inline">Mods & Saves</span>
      </a>
      <a href="app-notifications.html" class="flex items-center justify-center md:justify-start gap-3 px-2 md:px-4 py-3 text-zinc-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" title="Notifications">
        <i data-lucide="bell" class="w-5 h-5"></i> <span class="hidden md:inline">Notifications</span>
      </a>
      <a href="app-settings.html" class="flex items-center justify-center md:justify-start gap-3 px-2 md:px-4 py-3 text-zinc-400 hover:text-white hover:bg-white/5 rounded-xl transition-colors" title="Settings">
        <i data-lucide="settings" class="w-5 h-5"></i> <span class="hidden md:inline">Settings</span>
      </a>
    </nav>
  </aside>


  <script>
    lucide.createIcons();

    // Wishlist functionality
    const wishlistBtn = document.getElementById('wishlistBtn');
    wishlistBtn.addEventListener('click', function() {
      this.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i> Added to Wishlist';
      this.classList.remove('bg-amber-600', 'hover:bg-amber-500');
      this.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
      lucide.createIcons();
      
      setTimeout(() => {
        this.innerHTML = '<i data-lucide="heart" class="w-5 h-5"></i> In Wishlist';
        lucide.createIcons();
      }, 1500);
    });
  </script>
</body>
</html>
