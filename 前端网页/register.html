<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | GameVerse Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { background: '#09090b', surface: '#18181b', primary: '#6366f1', secondary: '#a1a1aa' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #09090b; color: #ffffff; }
    .glass-panel { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .input-error { border-color: #ef4444 !important; }
    .error-message { color: #ef4444; font-size: 0.875rem; margin-top: 0.5rem; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden py-8">
  
  <!-- Background Effects -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-indigo-600/20 rounded-full blur-[150px] -z-10"></div>
  <div class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-purple-600/10 rounded-full blur-[120px] -z-10"></div>

  <!-- Register Container -->
  <div class="w-full max-w-md px-6">
    
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 mb-4">
        <i data-lucide="gamepad-2" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold mb-2">Create Account</h1>
      <p class="text-zinc-400">Join GameVerse and unify your game library</p>
    </div>

    <!-- Register Form -->
    <div class="glass-panel rounded-2xl p-8 border border-white/10">
      <form id="registerForm" class="space-y-5">
        
        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-zinc-300 mb-2">Username *</label>
          <div class="relative">
            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500"></i>
            <input 
              type="text" 
              id="username"
              placeholder="Choose a username"
              class="w-full bg-white/5 border border-white/10 rounded-xl pl-12 pr-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors"
              required
              minlength="3"
            >
          </div>
          <p id="usernameError" class="error-message hidden"></p>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-zinc-300 mb-2">Email Address *</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500"></i>
            <input 
              type="email" 
              id="email"
              placeholder="your.email@example.com"
              class="w-full bg-white/5 border border-white/10 rounded-xl pl-12 pr-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors"
              required
            >
          </div>
          <p id="emailError" class="error-message hidden"></p>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-zinc-300 mb-2">Password *</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500"></i>
            <input 
              type="password" 
              id="password"
              placeholder="Create a strong password"
              class="w-full bg-white/5 border border-white/10 rounded-xl pl-12 pr-12 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors"
              required
              minlength="8"
            >
            <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-white transition-colors">
              <i data-lucide="eye" class="w-5 h-5"></i>
            </button>
          </div>
          <p id="passwordError" class="error-message hidden"></p>
          <!-- Password Strength Indicator -->
          <div class="mt-2 flex gap-1">
            <div id="strength1" class="h-1 flex-1 bg-white/10 rounded-full transition-colors"></div>
            <div id="strength2" class="h-1 flex-1 bg-white/10 rounded-full transition-colors"></div>
            <div id="strength3" class="h-1 flex-1 bg-white/10 rounded-full transition-colors"></div>
            <div id="strength4" class="h-1 flex-1 bg-white/10 rounded-full transition-colors"></div>
          </div>
          <p id="strengthText" class="text-xs text-zinc-500 mt-1"></p>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-medium text-zinc-300 mb-2">Confirm Password *</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500"></i>
            <input 
              type="password" 
              id="confirmPassword"
              placeholder="Confirm your password"
              class="w-full bg-white/5 border border-white/10 rounded-xl pl-12 pr-12 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors"
              required
            >
            <button type="button" id="toggleConfirmPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-white transition-colors">
              <i data-lucide="eye" class="w-5 h-5"></i>
            </button>
          </div>
          <p id="confirmPasswordError" class="error-message hidden"></p>
        </div>

        <!-- Terms & Privacy -->
        <div>
          <label class="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" id="agreeTerms" class="w-4 h-4 mt-1 rounded border-white/10 bg-white/5 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-0" required>
            <span class="text-sm text-zinc-400">
              I agree to the <a href="#" class="text-indigo-400 hover:text-indigo-300">Terms of Service</a> and <a href="#" class="text-indigo-400 hover:text-indigo-300">Privacy Policy</a>
            </span>
          </label>
        </div>

        <!-- Register Button -->
        <button 
          type="submit"
          id="submitBtn"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition-colors flex items-center justify-center gap-2"
        >
          Create Account
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

        <!-- Divider -->
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-white/10"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-[#18181b] text-zinc-500">Or sign up with</span>
          </div>
        </div>

        <!-- Social Sign Up -->
        <div class="grid grid-cols-3 gap-3">
          <button type="button" class="py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-colors flex items-center justify-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Steam_icon_logo.svg/1024px-Steam_icon_logo.svg.png" class="w-5 h-5" alt="Steam">
          </button>
          <button type="button" class="py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-colors flex items-center justify-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Epic_Games_logo.png" class="w-5 h-5" alt="Epic">
          </button>
          <button type="button" class="py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-colors flex items-center justify-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Xbox_one_logo.svg/2048px-Xbox_one_logo.svg.png" class="w-5 h-5" alt="Xbox">
          </button>
        </div>

      </form>

      <!-- Sign In Link -->
      <div class="mt-6 text-center text-sm text-zinc-400">
        Already have an account? 
        <a href="login.html" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Sign in</a>
      </div>
    </div>

    <!-- Back to Home -->
    <div class="mt-6 text-center">
      <a href="index.html" class="text-sm text-zinc-500 hover:text-zinc-400 transition-colors inline-flex items-center gap-2">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Home
      </a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // Form elements
    const form = document.getElementById('registerForm');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const agreeTerms = document.getElementById('agreeTerms');

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        passwordInput.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    });

    document.getElementById('toggleConfirmPassword').addEventListener('click', function() {
      const icon = this.querySelector('i');
      if (confirmPasswordInput.type === 'password') {
        confirmPasswordInput.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        confirmPasswordInput.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    });

    // Password strength checker
    passwordInput.addEventListener('input', function() {
      const password = this.value;
      const strength = calculatePasswordStrength(password);
      updateStrengthIndicator(strength);
    });

    function calculatePasswordStrength(password) {
      let strength = 0;
      if (password.length >= 8) strength++;
      if (password.length >= 12) strength++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
      if (/\d/.test(password)) strength++;
      if (/[^a-zA-Z0-9]/.test(password)) strength++;
      return Math.min(strength, 4);
    }

    function updateStrengthIndicator(strength) {
      const indicators = ['strength1', 'strength2', 'strength3', 'strength4'];
      const colors = ['#ef4444', '#f59e0b', '#eab308', '#22c55e'];
      const texts = ['Weak', 'Fair', 'Good', 'Strong'];
      
      indicators.forEach((id, index) => {
        const element = document.getElementById(id);
        if (index < strength) {
          element.style.backgroundColor = colors[strength - 1];
        } else {
          element.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
        }
      });

      const strengthText = document.getElementById('strengthText');
      if (strength > 0) {
        strengthText.textContent = `Password strength: ${texts[strength - 1]}`;
        strengthText.style.color = colors[strength - 1];
      } else {
        strengthText.textContent = '';
      }
    }

    // Real-time validation
    usernameInput.addEventListener('blur', validateUsername);
    emailInput.addEventListener('blur', validateEmail);
    passwordInput.addEventListener('blur', validatePassword);
    confirmPasswordInput.addEventListener('blur', validateConfirmPassword);

    function validateUsername() {
      const username = usernameInput.value.trim();
      const errorElement = document.getElementById('usernameError');
      
      if (username.length < 3) {
        showError(usernameInput, errorElement, 'Username must be at least 3 characters');
        return false;
      }
      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        showError(usernameInput, errorElement, 'Username can only contain letters, numbers, and underscores');
        return false;
      }
      hideError(usernameInput, errorElement);
      return true;
    }

    function validateEmail() {
      const email = emailInput.value.trim();
      const errorElement = document.getElementById('emailError');
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      
      if (!emailRegex.test(email)) {
        showError(emailInput, errorElement, 'Please enter a valid email address');
        return false;
      }
      hideError(emailInput, errorElement);
      return true;
    }

    function validatePassword() {
      const password = passwordInput.value;
      const errorElement = document.getElementById('passwordError');
      
      if (password.length < 8) {
        showError(passwordInput, errorElement, 'Password must be at least 8 characters');
        return false;
      }
      if (!/(?=.*[a-z])(?=.*[A-Z])/.test(password)) {
        showError(passwordInput, errorElement, 'Password must contain both uppercase and lowercase letters');
        return false;
      }
      if (!/\d/.test(password)) {
        showError(passwordInput, errorElement, 'Password must contain at least one number');
        return false;
      }
      hideError(passwordInput, errorElement);
      return true;
    }

    function validateConfirmPassword() {
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const errorElement = document.getElementById('confirmPasswordError');
      
      if (password !== confirmPassword) {
        showError(confirmPasswordInput, errorElement, 'Passwords do not match');
        return false;
      }
      hideError(confirmPasswordInput, errorElement);
      return true;
    }

    function showError(input, errorElement, message) {
      input.classList.add('input-error');
      errorElement.textContent = message;
      errorElement.classList.remove('hidden');
    }

    function hideError(input, errorElement) {
      input.classList.remove('input-error');
      errorElement.classList.add('hidden');
    }

    // Form submission
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Validate all fields
      const isUsernameValid = validateUsername();
      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();
      const isConfirmPasswordValid = validateConfirmPassword();
      
      if (!agreeTerms.checked) {
        alert('Please agree to the Terms of Service and Privacy Policy');
        return;
      }

      if (isUsernameValid && isEmailValid && isPasswordValid && isConfirmPasswordValid) {
        // Demo registration - in production, this would be an API call
        const userData = {
          username: usernameInput.value.trim(),
          email: emailInput.value.trim(),
          password: passwordInput.value
        };

        // Simulate API call
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Creating account...';
        lucide.createIcons();

        setTimeout(() => {
          // Store user data (in production, this would come from API response)
          localStorage.setItem('gameverse_user', userData.username);
          
          // Show success message
          alert('Account created successfully! Redirecting to dashboard...');
          
          // Redirect to dashboard
          window.location.href = 'index.html';
        }, 1500);
      }
    });

    // Check if already logged in
    if (localStorage.getItem('gameverse_user') || sessionStorage.getItem('gameverse_user')) {
      // Optional: redirect to dashboard if already logged in
      // window.location.href = 'index.html';
    }
  </script>
</body>
</html>
