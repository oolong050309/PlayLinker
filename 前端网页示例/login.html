<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | GameVerse Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { background: '#09090b', surface: '#18181b', primary: '#6366f1', secondary: '#a1a1aa' },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body { background-color: #09090b; color: #ffffff; }
    .glass-panel { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
  
  <!-- Background Effects -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-indigo-600/20 rounded-full blur-[150px] -z-10"></div>
  <div class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-purple-600/10 rounded-full blur-[120px] -z-10"></div>

  <!-- Login Container -->
  <div class="w-full max-w-md px-6">
    
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 mb-4">
        <i data-lucide="gamepad-2" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl font-bold mb-2">Welcome to GameVerse</h1>
      <p class="text-zinc-400">Sign in to access your unified game library</p>
    </div>

    <!-- Login Form -->
    <div class="glass-panel rounded-2xl p-8 border border-white/10">
      <form id="loginForm" class="space-y-6">
        
        <!-- Username/Email -->
        <div>
          <label class="block text-sm font-medium text-zinc-300 mb-2">Username or Email</label>
          <div class="relative">
            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500"></i>
            <input 
              type="text" 
              id="username"
              placeholder="Enter your username or email"
              class="w-full bg-white/5 border border-white/10 rounded-xl pl-12 pr-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors"
              required
            >
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-zinc-300 mb-2">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-zinc-500"></i>
            <input 
              type="password" 
              id="password"
              placeholder="Enter your password"
              class="w-full bg-white/5 border border-white/10 rounded-xl pl-12 pr-12 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition-colors"
              required
            >
            <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-white transition-colors">
              <i data-lucide="eye" class="w-5 h-5"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-white/10 bg-white/5 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-0">
            <span class="text-sm text-zinc-400">Remember me</span>
          </label>
          <a href="#" class="text-sm text-indigo-400 hover:text-indigo-300 transition-colors">Forgot password?</a>
        </div>

        <!-- Login Button -->
        <button 
          type="submit"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition-colors flex items-center justify-center gap-2"
        >
          Sign In
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>

        <!-- Divider -->
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-white/10"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-[#18181b] text-zinc-500">Or continue with</span>
          </div>
        </div>

        <!-- Social Login -->
        <div class="grid grid-cols-3 gap-3">
          <button type="button" class="py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-colors flex items-center justify-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Steam_icon_logo.svg/1024px-Steam_icon_logo.svg.png" class="w-5 h-5" alt="Steam">
          </button>
          <button type="button" class="py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-colors flex items-center justify-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Epic_Games_logo.png" class="w-5 h-5" alt="Epic">
          </button>
          <button type="button" class="py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl transition-colors flex items-center justify-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f9/Xbox_one_logo.svg/2048px-Xbox_one_logo.svg.png" class="w-5 h-5" alt="Xbox">
          </button>
        </div>

      </form>

      <!-- Sign Up Link -->
      <div class="mt-6 text-center text-sm text-zinc-400">
        Don't have an account? 
        <a href="register.html" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Sign up</a>
      </div>
    </div>

    <!-- Back to Home -->
    <div class="mt-6 text-center">
      <a href="index.html" class="text-sm text-zinc-500 hover:text-zinc-400 transition-colors inline-flex items-center gap-2">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Back to Home
      </a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        passwordInput.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    });

    // Handle form submission
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      // Demo login - in production, this would be an API call
      if (username && password) {
        // Store login state
        if (rememberMe) {
          localStorage.setItem('gameverse_user', username);
        } else {
          sessionStorage.setItem('gameverse_user', username);
        }
        
        // Redirect to dashboard
        window.location.href = 'app-dashboard.html';
      }
    });

    // Check if already logged in
    if (localStorage.getItem('gameverse_user') || sessionStorage.getItem('gameverse_user')) {
      // Optional: redirect to dashboard if already logged in
      // window.location.href = 'app-dashboard.html';
    }
  </script>
</body>
</html>
